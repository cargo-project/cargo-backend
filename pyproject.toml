[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cargo-backend"
version = "2.0.0"
description = "CarGO v2 backend: automated real-time monitoring of heavy cargo vehicles (IoT + PostGIS + CEP)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.162,<1.0",
  "uvicorn[standard]>=0.54,<1.0",
  "pydantic>=2.14,<3.0",
  "pydantic-settings>=2.16,<3.0",
  "email-validator>=2.2,<3.0",
  "sqlalchemy[asyncio]>=2.1,<2.2",
  "asyncpg>=0.32,<1.0",
  "alembic>=1.20,<2.0",
  "geoalchemy2>=0.21,<1.0",
  "argon2-cffi>=25.1,<26.0",
  "pyjwt>=2.15,<3.0",
  "aiomqtt>=2.5,<3.0",
  "httpx>=0.28,<1.0",
  "shapely>=2.1,<3.0",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.17,<0.18",
  "mypy>=2.4,<3.0",
  "pytest>=9.2,<10.0",
  "pytest-asyncio>=1.4,<2.0",
  "pytest-cov>=7.1,<8.0",
  "pre-commit>=4.3,<5.0",
  "websockets>=15,<16",
]

[tool.setuptools.packages.find]
include = ["app*"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "SIM",      # simplify
  "ASYNC",    # async pitfalls
  "S",        # bandit (security)
  "RUF",      # ruff-specific
  "T20",      # forbid print()
  "PTH",      # pathlib
]
ignore = [
  "S101",     # assert is fine in tests (scoped below as well)
  "B008",     # FastAPI Depends() in defaults is the idiomatic DI style
  "RUF012",
]

[tool.ruff.lint.isort]
# The local ./alembic folder holds migrations; the package itself is a third-party dependency.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"scripts/**" = ["S105"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "shapely.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs PostgreSQL/PostGIS (and MQTT/Siddhi for some tests) running in Docker",
  "e2e: full Docker Compose pipeline",
  "cep: needs the Siddhi CEP container",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/entrypoints/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
