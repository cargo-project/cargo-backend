# Proxy inverso: un solo origen para la web (/) y la API (/api/v1, incluido el WebSocket).
# En producción el TLS termina acá (certificados montados en /etc/nginx/certs).
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 1m;
  sendfile on;
  keepalive_timeout 65;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # DNS de Docker, se vuelve a resolver cada 10 s para que los contenedores recreados (IP nueva) sigan andando.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Hacia otros dominios solo va el origen. Los servidores de mapas (OpenStreetMap) piden
    # Referer y sin él responden 403 "Access blocked"; con no-referrer se rompía el mapa.
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    set $api http://api:8000;
    set $frontend http://frontend:3000;

    location = /health { proxy_pass $api/health/ready; }

    location /api/v1/ws {
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 1h;
    }

    location /api/ {
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    location / {
      # El contenedor del frontend es opcional (perfil "frontend" de compose).
      proxy_pass $frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
