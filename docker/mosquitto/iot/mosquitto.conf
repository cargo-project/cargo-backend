# Broker IoT de CarGO (frontera externa).
# - 8883: MQTT sobre TLS para los dispositivos Edge (puerto publicado).
# - 1883: listener sin TLS, solo accesible dentro de la red privada de Docker (servicio de ingesta).
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
max_inflight_messages 50
max_queued_messages 10000

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

listener 1883
protocol mqtt
