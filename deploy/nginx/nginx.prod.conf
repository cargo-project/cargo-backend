# Proxy inverso de producción: HTTPS para la web (/) y la API (/api/v1, incluido el WebSocket).
# Los server{} salen de templates/cargo.conf.template: la imagen de Nginx reemplaza ${CARGO_DOMAIN} al arrancar.
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 1m;
  sendfile on;
  keepalive_timeout 65;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # DNS de Docker, se vuelve a resolver cada 10 s para que los contenedores recreados (IP nueva) sigan andando.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Límite por IP en los endpoints públicos sensibles (fuerza bruta, registros falsos, abuso de códigos por Telegram).
  # Se suma al bloqueo por cuenta y a los límites por usuario que ya aplica la API.
  limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=auth_account:10m rate=5r/m;
  limit_req_status 429;
  limit_req_log_level warn;

  include /etc/nginx/conf.d/cargo.conf;
}
