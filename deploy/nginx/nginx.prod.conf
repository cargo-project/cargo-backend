# Proxy inverso de producción: HTTPS para la web (/) y la API (/api/v1, incluido el WebSocket).
# Los server{} salen de templates/cargo.conf.template: la imagen de Nginx reemplaza ${CARGO_DOMAIN} al arrancar.
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 1m;
  sendfile on;
  keepalive_timeout 65;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # DNS de Docker, se vuelve a resolver cada 10 s para que los contenedores recreados (IP nueva) sigan andando.
  resolver 127.0.0.11 valid=10s ipv6=off;

  include /etc/nginx/conf.d/cargo.conf;
}
